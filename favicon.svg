<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="p" cx="36%" cy="32%" r="72%">
      <stop offset="0" stop-color="#F3CE96"/>
      <stop offset="46%" stop-color="#D79A4A"/>
      <stop offset="100%" stop-color="#5E3614"/>
    </radialGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEE6D6" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#EEE6D6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#EEE6D6" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="back"><rect x="0" y="0" width="64" height="32"/></clipPath>
    <clipPath id="front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="12" fill="#070C18"/>

  <!-- 環の後ろ半分 → 球 → 手前半分。本物の土星と同じ重ね順 -->
  <g transform="rotate(-18 32 34)">
    <ellipse cx="32" cy="34" rx="25" ry="6.5" fill="none"
             stroke="url(#r)" stroke-width="3" clip-path="url(#back)"/>
  </g>
  <circle cx="32" cy="32" r="15" fill="url(#p)"/>
  <g transform="rotate(-18 32 34)">
    <ellipse cx="32" cy="34" rx="25" ry="6.5" fill="none"
             stroke="url(#r)" stroke-width="3" clip-path="url(#front)"/>
  </g>

  <circle cx="51" cy="14" r="1.5" fill="#fff" opacity=".9"/>
  <circle cx="12" cy="18" r="1" fill="#fff" opacity=".6"/>
  <circle cx="15" cy="49" r="1.2" fill="#fff" opacity=".5"/>
</svg>
