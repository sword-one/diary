<meta property="og:type" content="website">

<body>

<a class="skip-link" href="#rk">本文へ移動</a>

<header class="hd is-on"><div class="hd-in">
  <a class="logo" href="index.html">ORBIT</a>
  <span class="logo-sub">オービット</span>
  <nav class="hd-nav"><a href="index.html#list">記事一覧</a><a href="index.html#about">このサイトについて</a></nav>
</div></header>

<div class="lead-in">
  <h1>いま読まれている本</h1>
  <p>世の中でいま売れている本です。そのうち、ここで記事にしたものと、本棚にあるものには印をつけています。<b>読んだ本と、読まれている本は、だいたいずれています。</b>そのずれ自体が、何を読むかのヒントになると思っています。</p>
</div>

<div class="rk" id="rk">
  <div class="rk-meta" id="rkMeta"></div>
  <ol class="rk-list" id="rkList"></ol>
  <p class="rk-empty" id="rkEmpty" hidden>
    ランキングはまだ取得していません。<br>
    <code>python tools/fetch-ranking.py</code> を実行すると出ます。
  </p>
  <p class="rk-credit" id="rkCredit"></p>
</div>

<footer>
  <span>ORBIT</span><span>株式会社ソードワン</span><span>記事中の引用はすべて出典を明記しています</span>
</footer>

<script>
/* ランキングは tools/fetch-ranking.py が作った静的なJSONを読むだけ。
   閲覧者のアクセスで楽天のAPIを叩かないので、IDが出ず、表示も速い */
fetch('ranking.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    const list = document.getElementById('rkList');
    if (!d.items || !d.items.length) throw 0;

    document.getElementById('rkMeta').textContent =
      d.source + '　' + d.updated + ' 時点';

    list.innerHTML = d.items.map((b, i) => {
      const mark = b.article
        ? '<a class="rk-read" href="' + b.article + '">記事を読む →</a>'
        : (b.shelf ? '<span class="rk-shelf">本棚にあります</span>' : '');
      const cover = b.cover
        ? '<img src="' + b.cover + '" alt="" loading="lazy" width="120" height="170">'
        : '<span class="rk-nocover"></span>';
      return '<li class="rk-row' + (b.article ? ' is-mine' : '') + '">' +
        '<span class="rk-no">' + (i + 1) + '</span>' +
        '<span class="rk-cov">' + cover + '</span>' +
        '<span class="rk-body">' +
          '<span class="rk-t">' + b.title + '</span>' +
          '<span class="rk-a">' + [b.author, b.publisher].filter(Boolean).join('／') + '</span>' +
          '<span class="rk-g">' + b.genre + '</span>' +
          mark +
          (b.url ? '<a class="rk-buy" href="' + b.url + '" target="_blank" rel="noopener noreferrer sponsored">楽天ブックスで見る</a>' : '') +
        '</span>' +
      '</li>';
    }).join('');

    document.getElementById('rkCredit').textContent =
      d.credit + (d.affiliate ? '　※リンクにはアフィリエイトを含みます' : '');
  })
  .catch(() => {
    document.getElementById('rkEmpty').hidden = false;
  });
</script>

</body>
</html>
